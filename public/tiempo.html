<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KAIRÓS · Chamalnquimyst Labs</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --calipso:#00e8c8;
    --calipso-bright:#8dfff0;
    --calipso-dim:#00a88f;
    --violet:#9b6bff;
    --elecblue:#3d8bff;
    --void:#020208;
    --panel:rgba(4,14,18,0.14);
    --line:rgba(0,232,200,0.22);
    --text:#d8fff5;
    --text-dim:rgba(216,255,245,0.55);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:var(--void);overflow:hidden;
    font-family:'Share Tech Mono',monospace;color:var(--text);}
  #scene-canvas{position:fixed;inset:0;z-index:1;cursor:pointer;touch-action:none;}

  /* ---------- PORTAL ---------- */
  #iframe-warning{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:100;
    max-width:340px;text-align:center;font-size:10.5px;color:#ffb37a;line-height:1.6;
    background:rgba(4,14,18,0.5);border:1px solid rgba(255,179,122,0.4);border-radius:10px;
    padding:10px 14px;}
  #iframe-warning .mini-btn{display:block;margin:8px auto 0;}

  /* ---------- HEADER ---------- */
  #hud-top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;
    align-items:flex-start;padding:18px 20px;pointer-events:none;}
  #hud-top *{pointer-events:auto;}
  .brand{font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:5px;font-size:14px;color:var(--elecblue);
    text-shadow:0 0 14px rgba(61,139,255,0.85), 0 0 28px rgba(61,139,255,0.4);
    transition:opacity 1.4s ease;opacity:1;}
  .brand span{display:block;font-family:'Share Tech Mono',monospace;font-weight:400;letter-spacing:2px;
    font-size:9px;color:var(--text-dim);margin-top:3px;}
  #resonancia{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2px;color:var(--text-dim);}
  #resonancia b{color:var(--calipso-bright);font-size:15px;}
  #notif-btn{background:rgba(0,232,200,0.08);border:1px solid var(--line);color:var(--text-dim);
    font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;padding:7px 12px;
    border-radius:20px;cursor:pointer;margin-top:8px;}
  #notif-btn.on{color:var(--calipso-bright);border-color:var(--calipso);}

  #hint{position:fixed;bottom:calc(52vh + 14px);left:50%;transform:translateX(-50%);z-index:15;
    font-size:11px;letter-spacing:2px;color:var(--text-dim);text-align:center;opacity:0.85;
    text-transform:uppercase;pointer-events:none;transition:opacity .5s;}

  /* ---------- DOCK ---------- */
  #dock{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;pointer-events:none;}
  #dock-panel{width:100%;max-width:640px;max-height:52vh;overflow:hidden;
    transform:translateY(12px);opacity:0;pointer-events:none;transition:transform .28s ease, opacity .22s ease;}
  #dock-panel.open{transform:translateY(0);opacity:1;pointer-events:auto;}
  #dock-toggle{margin:0 0 14px;padding:10px 22px;border-radius:22px;border:1px solid var(--line);
    background:rgba(4,14,18,0.4);color:var(--calipso-bright);font-family:'Orbitron',sans-serif;
    font-size:11px;letter-spacing:2px;cursor:pointer;position:relative;pointer-events:auto;}
  #dock-toggle .badge{position:absolute;top:-6px;right:-6px;}

  #pulsar-actions{position:fixed;left:50%;top:78%;transform:translate(-50%,-50%) translateY(10px);
    z-index:55;display:flex;gap:10px;opacity:0;pointer-events:none;transition:opacity .22s ease, transform .22s ease;}
  #pulsar-actions.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) translateY(0);}

  #top-toggle-wrap{position:fixed;left:50%;top:20%;transform:translate(-50%,-50%) translateY(-8px);
    z-index:55;opacity:0;pointer-events:none;transition:opacity .22s ease, transform .22s ease;}
  #top-toggle-wrap.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) translateY(0);}
  #tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-bottom:none;
    border-radius:10px 10px 0 0;overflow:hidden;}
  .tab{padding:11px 18px;font-size:11px;letter-spacing:1.5px;color:var(--text-dim);cursor:pointer;
    text-transform:uppercase;position:relative;transition:color .2s;}
  .tab.active{color:var(--calipso-bright);background:rgba(0,232,200,0.08);}
  .tab .badge{display:inline-block;min-width:16px;padding:0 4px;margin-left:6px;background:var(--violet);
    color:#fff;border-radius:8px;font-size:9px;text-align:center;}
  #panel{width:100%;max-width:640px;max-height:52vh;background:var(--panel);border-top:1px solid var(--line);
    overflow-y:auto;padding:18px 20px 24px;touch-action:pan-y;}
  #panel::-webkit-scrollbar{width:5px;}
  #panel::-webkit-scrollbar-thumb{background:var(--calipso-dim);border-radius:4px;}

  h3.section-label{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:3px;color:var(--calipso-bright);
    text-transform:uppercase;margin:14px 0 8px;}
  h3.section-label:first-child{margin-top:0;}

  /* ---------- LISTS ---------- */
  .msg-card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:rgba(0,20,18,0.35);}
  .msg-card .m-top{display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim);margin-bottom:6px;}
  .msg-card .m-preview{font-size:12px;color:var(--text);line-height:1.5;margin-bottom:8px;}
  .bounce-line{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;
    color:var(--text-dim);padding:5px 0;border-top:1px dashed rgba(0,232,200,0.15);}
  .bounce-line.arrived{color:var(--calipso-bright);}
  .cal-link{font-size:9px;color:var(--violet);text-decoration:underline;cursor:pointer;}
  .arrived-btn{background:rgba(0,232,200,0.12);border:1px solid var(--calipso);color:var(--calipso-bright);
    font-size:10px;padding:5px 10px;border-radius:5px;cursor:pointer;letter-spacing:1px;}
  .empty-state{text-align:center;color:var(--text-dim);font-size:12px;padding:30px 10px;line-height:1.7;}

  /* ---------- REPRODUCIR ---------- */
  #reproducir-wrap{text-align:center;padding:10px 6px;}
  #play-big-btn{width:66px;height:66px;border-radius:50%;border:1px solid var(--calipso);
    background:radial-gradient(circle,rgba(0,232,200,0.18),transparent 70%);
    color:var(--calipso-bright);font-size:22px;cursor:pointer;transition:all .25s;
    display:flex;align-items:center;justify-content:center;}
  #play-big-btn:hover{box-shadow:0 0 28px rgba(0,232,200,0.5);}
  #play-big-btn.playing{border-color:var(--violet);color:#c8b6ff;}
  .icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(0,232,200,0.05);
    color:var(--calipso-bright);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{border-color:var(--calipso-dim);}
  #now-playing{font-size:10.5px;color:var(--text-dim);letter-spacing:1px;min-height:16px;margin-top:8px;
    max-width:340px;margin-left:auto;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #now-playing-audio{display:none;}

  /* ---------- OVERLAY (acciones / grabar / programar / mensaje) ---------- */
  #overlay-bg{position:fixed;inset:0;background:rgba(0,4,4,0.20);z-index:200;
    display:none;align-items:center;justify-content:center;padding:20px;}
  #overlay-bg.show{display:flex;}
  #overlay-box{max-width:460px;width:100%;background:var(--panel);border:1px solid var(--calipso);border-radius:14px;
    padding:26px;box-shadow:0 0 60px rgba(0,232,200,0.25);max-height:82vh;overflow-y:auto;touch-action:pan-y;}
  #overlay-box .o-label{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:3px;color:var(--calipso-bright);
    margin-bottom:16px;text-transform:uppercase;}
  #overlay-box .o-body{font-size:14px;line-height:1.7;color:var(--text);margin-bottom:16px;white-space:pre-wrap;}
  #overlay-box audio{width:100%;margin-bottom:16px;}

  .choice-row{display:flex;gap:10px;margin-bottom:6px;}
  .choice-card{flex:1;border:1px solid var(--line);border-radius:10px;padding:20px 12px;text-align:center;
    cursor:pointer;transition:all .2s;}
  .choice-card:hover{border-color:var(--calipso-dim);background:rgba(0,232,200,0.05);}
  .choice-card .c-icon{font-size:26px;margin-bottom:8px;}
  .choice-card .c-label{font-size:12px;letter-spacing:1px;color:var(--calipso-bright);}
  .choice-card .c-desc{font-size:9.5px;color:var(--text-dim);margin-top:4px;line-height:1.5;}

  /* ficha de acción compacta (tocar el pulsar) */
  #overlay-box.compact{padding:14px 18px;}
  .choice-row-compact{display:flex;gap:10px;justify-content:center;}
  .pill-btn{display:flex;align-items:center;gap:8px;padding:11px 20px;border:1px solid var(--calipso);
    border-radius:26px;background:rgba(0,232,200,0.08);color:var(--calipso-bright);cursor:pointer;
    font-size:13px;letter-spacing:0.5px;white-space:nowrap;transition:background .2s;}
  .pill-btn:hover{background:rgba(0,232,200,0.16);}

  .icon-pill{width:52px;height:52px;border-radius:50%;border:1px solid var(--calipso);
    background:rgba(0,232,200,0.08);color:var(--calipso-bright);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;
    font-family:'Share Tech Mono',monospace;transition:background .2s, color .2s, border-color .2s;}
  .icon-pill:hover{background:rgba(0,232,200,0.16);}
  .icon-pill.icon-record{border-color:#ff4d5e;color:#ff4d5e;background:rgba(255,77,94,0.08);}
  .icon-pill.icon-record:hover{background:rgba(255,77,94,0.16);}
  .icon-pill.recording{border-color:#ff4d5e;color:#ff8d8d;background:rgba(255,77,94,0.2);
    animation:pulseRec 1s infinite;}

  /* zoom al abrir una tarjeta de texto orbitante */
  @keyframes zoomIn{from{transform:scale(0.7);opacity:0;}to{transform:scale(1);opacity:1;}}
  #overlay-box.zoom{animation:zoomIn .32s cubic-bezier(.2,.8,.3,1.2);}

  #skip-btn{padding:9px 14px;}

  textarea#msg-text{width:100%;min-height:110px;background:rgba(0,20,18,0.5);border:1px solid var(--line);
    color:var(--text);font-family:'Share Tech Mono',monospace;font-size:13px;padding:10px;border-radius:6px;
    resize:vertical;outline:none;margin-bottom:14px;}
  textarea#msg-text:focus{border-color:var(--calipso);}

  #rec-stage{text-align:center;padding:10px 0 4px;}
  .rec-btn-big{width:76px;height:76px;border-radius:50%;border:1px solid var(--calipso);background:rgba(0,232,200,0.06);
    cursor:pointer;display:flex;align-items:center;justify-content:center;margin:6px auto 14px;}
  .rec-btn-big .dot{width:24px;height:24px;border-radius:50%;background:#ff4d5e;}
  .rec-btn-big.recording .dot{border-radius:5px;animation:pulseRec 1s infinite;}
  @keyframes pulseRec{0%,100%{opacity:1}50%{opacity:.4}}
  #rec-status{font-size:11px;color:var(--text-dim);margin-bottom:10px;}
  #voice-preview{display:none;width:100%;margin-bottom:12px;}

  .btn-primary{width:100%;padding:14px;font-family:'Orbitron',sans-serif;letter-spacing:3px;
    font-size:12px;text-transform:uppercase;background:linear-gradient(90deg,var(--calipso-dim),var(--calipso));
    color:#00201c;border:none;border-radius:8px;cursor:pointer;font-weight:700;transition:opacity .2s;}
  .btn-primary:disabled{opacity:.3;cursor:not-allowed;}
  .btn-primary:not(:disabled):hover{filter:brightness(1.15);}
  .btn-ghost{width:100%;padding:11px;background:transparent;border:1px solid var(--line);color:var(--text-dim);
    border-radius:6px;cursor:pointer;letter-spacing:1px;font-size:11px;margin-top:8px;}

  .mode-toggle{display:flex;gap:2px;margin-bottom:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .mode-btn{flex:1;padding:10px;text-align:center;font-size:11px;letter-spacing:1px;color:var(--text-dim);cursor:pointer;}
  .mode-btn.active{background:rgba(0,232,200,0.1);color:var(--calipso-bright);}

  .preset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:6px;}
  .preset-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .2s;}
  .preset-card:hover{border-color:var(--calipso-dim);}
  .preset-card.selected{border-color:var(--calipso);background:rgba(0,232,200,0.08);}
  .preset-card .p-title{font-size:12px;color:var(--calipso-bright);letter-spacing:1px;margin-bottom:4px;}
  .preset-card .p-desc{font-size:10px;color:var(--text-dim);line-height:1.5;}

  .coord-copy{font-size:11px;color:var(--text-dim);line-height:1.7;margin-bottom:10px;}
  .custom-date-row{display:flex;gap:8px;margin:8px 0;align-items:center;flex-wrap:wrap;}
  input[type="datetime-local"], input[type="number"]{background:rgba(0,20,18,0.5);border:1px solid var(--line);
    color:var(--text);font-family:'Share Tech Mono',monospace;font-size:12px;padding:8px;border-radius:5px;outline:none;}
  select{background:rgba(0,20,18,0.5);border:1px solid var(--line);color:var(--text);
    font-family:'Share Tech Mono',monospace;font-size:12px;padding:8px;border-radius:5px;outline:none;}
  .mini-btn{background:transparent;border:1px solid var(--calipso-dim);color:var(--calipso-bright);
    font-size:10px;letter-spacing:1px;padding:7px 12px;border-radius:5px;cursor:pointer;text-transform:uppercase;}
  .mini-btn:hover{border-color:var(--calipso);}
  .mini-btn.tag-on{background:rgba(0,232,200,0.18);border-color:var(--calipso);color:var(--calipso-bright);}

  .repeat-row{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:11px;color:var(--text-dim);}
  .repeat-details{display:none;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .repeat-details.show{display:flex;}

  #chosen-bounces{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .bounce-chip{font-size:10px;background:rgba(155,107,255,0.12);border:1px solid rgba(155,107,255,0.4);
    color:#c8b6ff;padding:4px 9px;border-radius:12px;display:flex;align-items:center;gap:6px;}
  .bounce-chip .x{cursor:pointer;opacity:.7;}

  #toast{position:fixed;bottom:calc(52vh + 20px);left:50%;transform:translateX(-50%);z-index:150;
    background:rgba(0,232,200,0.14);border:1px solid var(--calipso);color:var(--calipso-bright);
    padding:10px 20px;border-radius:20px;font-size:11px;letter-spacing:1px;opacity:0;transition:opacity .4s;
    pointer-events:none;white-space:nowrap;}
  #toast.show{opacity:1;}

  #zoom-close-btn{position:fixed;top:22px;left:50%;transform:translateX(-50%) scale(0.7);
    z-index:80;width:42px;height:42px;border-radius:50%;border:1px solid var(--calipso);
    background:rgba(4,14,18,0.55);color:var(--calipso-bright);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;}
  #zoom-close-btn.show{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1);}

  @media(max-width:600px){
    .brand{font-size:11px;}
    #hud-top{padding:14px;}
    #panel{max-height:46vh;padding:14px 14px 20px;}
    .choice-row{flex-direction:column;}
  }
</style>
</head>

<script>
/* =========================================================================
   KAIRÓS — el pulsar que te escribe desde el futuro
   Chamalnquimyst Labs · hemisferio derecho · Motor de Atención Soberana
   v2 — nebulosa central interactiva, alimentación por mensaje, reproducción
   ========================================================================= */

/* ---------------------------------------------------------------------
   1. ALMACENAMIENTO
   --------------------------------------------------------------------- */
const DB_NAME='kairos_db', DB_VERSION=1;
let dbInstance=null;
function openDB(){
  return new Promise((resolve,reject)=>{
    if(dbInstance){resolve(dbInstance);return;}
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('messages')) db.createObjectStore('messages',{keyPath:'id'});
      if(!db.objectStoreNames.contains('audio')) db.createObjectStore('audio',{keyPath:'id'});
    };
    req.onsuccess=e=>{dbInstance=e.target.result;resolve(dbInstance);};
    req.onerror=e=>reject(e);
  });
}
async function dbPut(store,value){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete=()=>resolve();
    tx.onerror=e=>reject(e);
  });
}
async function dbGetAll(store){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).getAll();
    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=e=>reject(e);
  });
}
async function dbGet(store,id){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).get(id);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=e=>reject(e);
  });
}
async function dbDelete(store,id){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(store,'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete=()=>resolve();
    tx.onerror=e=>reject(e);
  });
}

/* --------- Cámara orbital propia: Pointer Events unificados (mouse + touch + pen),
   sin el código legado de "touch events" que traía el bug del pageX --------- */
function SimpleOrbitControls(cam, dom){
  const self=this;
  this.target=new THREE.Vector3(0,46,-230);
  this.enabled=true;
  this.autoRotate=true;
  this.autoRotateSpeed=0.12;
  this.minDistance=45;
  this.maxDistance=700;
  this.maxPolarAngle=Math.PI*0.49;
  this.dampingFactor=0.08;

  const offset=cam.position.clone().sub(this.target);
  let radius=Math.max(offset.length(),0.001);
  let theta=Math.atan2(offset.x, offset.z);
  let phi=Math.acos(THREE.MathUtils.clamp(offset.y/radius,-1,1));
  let tRadius=radius, tTheta=theta, tPhi=phi;

  const pointers=new Map(); // pointerId -> {x,y}
  let pinchStartDist=null;
  let lastActivity=performance.now();

  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  function onDown(e){
    if(!self.enabled) return;
    lastActivity=performance.now();
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===2){
      const pts=[...pointers.values()];
      pinchStartDist=dist(pts[0], pts[1]);
    }
  }
  function onMove(e){
    if(!self.enabled || !pointers.has(e.pointerId)) return;
    lastActivity=performance.now();
    const prev=pointers.get(e.pointerId);
    const cur={x:e.clientX, y:e.clientY};
    pointers.set(e.pointerId, cur);

    if(pointers.size>=2){
      const pts=[...pointers.values()];
      const d=dist(pts[0], pts[1]);
      if(pinchStartDist!=null){
        const delta=pinchStartDist-d;
        tRadius=THREE.MathUtils.clamp(tRadius+delta*0.28, self.minDistance, self.maxDistance);
      }
      pinchStartDist=d;
      return;
    }
    const dx=cur.x-prev.x, dy=cur.y-prev.y;
    tTheta -= dx*0.0055;
    tPhi -= dy*0.0055;
    tPhi=THREE.MathUtils.clamp(tPhi, 0.12, self.maxPolarAngle);
  }
  function onUp(e){
    lastActivity=performance.now();
    pointers.delete(e.pointerId);
    if(pointers.size<2) pinchStartDist=null;
  }
  function onWheel(e){
    if(!self.enabled) return;
    e.preventDefault();
    tRadius=THREE.MathUtils.clamp(tRadius+e.deltaY*0.15, self.minDistance, self.maxDistance);
  }

  dom.addEventListener('pointerdown', onDown);
  dom.addEventListener('pointermove', onMove);
  dom.addEventListener('pointerup', onUp);
  dom.addEventListener('pointercancel', onUp);
  dom.addEventListener('pointerleave', onUp);
  dom.addEventListener('wheel', onWheel, {passive:false});

  /* auto-sanación: si quedó un dedo fantasma pegado (el navegador nunca mandó su
     pointerup/pointercancel), lo limpiamos solos para que los próximos toques respondan */
  setInterval(()=>{
    if(pointers.size>0 && performance.now()-lastActivity>3500){
      pointers.clear();
      pinchStartDist=null;
    }
  }, 2000);

  /* recalcula theta/phi/radius desde la posición actual de la cámara —
     se usa después de mover la cámara "a mano" (por ejemplo el zoom a una tarjeta) */
  this.syncFromCamera=function(){
    const off=cam.position.clone().sub(self.target);
    radius=tRadius=Math.max(off.length(),0.001);
    theta=tTheta=Math.atan2(off.x, off.z);
    phi=tPhi=Math.acos(THREE.MathUtils.clamp(off.y/radius,-1,1));
  };

  this.update=function(){
    if(!self.enabled) return; // congelado: no pisa animaciones manuales de cámara
    if(self.autoRotate && pointers.size===0){ tTheta += self.autoRotateSpeed*0.012; }
    theta += (tTheta-theta)*self.dampingFactor;
    phi += (tPhi-phi)*self.dampingFactor;
    radius += (tRadius-radius)*self.dampingFactor;
    const sinPhiR=Math.sin(phi)*radius;
    cam.position.set(
      self.target.x + sinPhiR*Math.sin(theta),
      self.target.y + Math.cos(phi)*radius,
      self.target.z + sinPhiR*Math.cos(theta)
    );
    cam.lookAt(self.target);
  };
}

const texWhiteHot=radialTexture('rgba(255,255,255,1)','rgba(0,232,200,0.9)');
const texCalipso=radialTexture('rgba(160,255,240,0.95)','rgba(0,190,165,0.5)');

/* ----------------- EL PULSAR KAIRÓS ----------------- */
const PULSAR_POS=new THREE.Vector3(0, 46, -230);

/* ruido orgánico: suma de senos en frecuencias no relacionadas entre sí,
   evita el efecto "metrónomo" de una sola onda sinusoidal */
function organicNoise(t, seed){
  return (
    Math.sin(t*0.37+seed)*0.5 +
    Math.sin(t*0.71+seed*1.37)*0.3 +
    Math.sin(t*1.23+seed*2.11)*0.15 +
    Math.sin(t*0.19+seed*0.53)*0.25
  );
}

class KairosPulsar{
  constructor(){
    this.group=new THREE.Object3D();
    this.group.position.copy(PULSAR_POS);
    scene.add(this.group);

    this.core=new THREE.Sprite(new THREE.SpriteMaterial({
      map:texWhiteHot, color:0xffffff, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false
    }));
    this.core.scale.set(14,14,1);
    this.group.add(this.core);

    /* núcleo interno "hirviendo": dos capas contrarrotando */
    this.boilA=new THREE.Sprite(new THREE.SpriteMaterial({
      map:texCalipso, color:0x00e8c8, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false, opacity:0.7
    }));
    this.boilA.scale.set(20,20,1);
    this.group.add(this.boilA);
    this.boilB=new THREE.Sprite(new THREE.SpriteMaterial({
      map:texCalipso, color:0x8dfff0, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false, opacity:0.55
    }));
    this.boilB.scale.set(24,24,1);
    this.group.add(this.boilB);

    this.plasma=new THREE.Sprite(new THREE.SpriteMaterial({
      map:texCalipso, color:0x00e8c8, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false, opacity:0.85
    }));
    this.plasma.scale.set(36,36,1);
    this.group.add(this.plasma);

    this.halo=new THREE.Sprite(new THREE.SpriteMaterial({
      map:texCalipso, color:0x00a88f, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false, opacity:0.32
    }));
    this.halo.scale.set(82,82,1);
    this.group.add(this.halo);

    /* filamentos / tendrils tipo prominencia solar */
    this.filaments=[];
    const FIL_N=6;
    for(let i=0;i<FIL_N;i++){
      const mat=new THREE.SpriteMaterial({
        map:texStreak, color: i%2===0?0x8dfff0:0x9b6bff,
        blending:THREE.AdditiveBlending, transparent:true, depthWrite:false, opacity:0.55, rotation:0
      });
      const sp=new THREE.Sprite(mat);
      sp.scale.set(46+Math.random()*20, 4.5, 1);
      const ang=(i/FIL_N)*Math.PI*2;
      sp.userData.baseAngle=ang;
      sp.userData.speed=0.15+Math.random()*0.2;
      sp.userData.radius=6+Math.random()*4;
      this.group.add(sp);
      this.filaments.push(sp);
    }

    /* corona interior: densa y caliente */
    this.coronaInner=this._buildCorona(700, 16, 34, 0x8dfff0, 0x00e8c8, 1.9);
    this.group.add(this.coronaInner);
    /* corona exterior: dispersa y fría, más lenta */
    this.coronaOuter=this._buildCorona(500, 34, 62, 0x9b6bff, 0x00a88f, 2.6);
    this.group.add(this.coronaOuter);

    this.flashEnergy=0;
    this.flashTarget=0;
    this.feedEnergy=0;
    this.feedTarget=0;
    this.baseScale=1;
    this.baseScaleTarget=1;
    this.lastPulseWave=0;
  }

  _buildCorona(count, rMin, rMax, colHexA, colHexB, size){
    const positions=new Float32Array(count*3);
    const colors=new Float32Array(count*3);
    const golden=Math.PI*(3-Math.sqrt(5));
    const c1=new THREE.Color(colHexA), c2=new THREE.Color(colHexB);
    for(let i=0;i<count;i++){
      const t=i/count;
      const r=rMin+Math.pow(t,0.5)*(rMax-rMin)+(Math.random()-0.5)*3;
      const theta=i*golden;
      const y=(Math.random()-0.5)*(rMax-rMin)*0.35;
      positions[i*3]=Math.cos(theta)*r;
      positions[i*3+1]=y;
      positions[i*3+2]=Math.sin(theta)*r;
      const mixed=c1.clone().lerp(c2, Math.random());
      colors[i*3]=mixed.r; colors[i*3+1]=mixed.g; colors[i*3+2]=mixed.b;
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
    return new THREE.Points(geo, new THREE.PointsMaterial({
      map:texCalipso, size, vertexColors:true, transparent:true, opacity:0.8,
      blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
    }));
  }

  setResonancia(res){
    this.baseScaleTarget=1 + Math.min(res,80)*0.007;
  }

  flash(){ this.flashTarget=1.0; }
  feed(){ this.feedTarget=1.0; this.flashTarget=Math.max(this.flashTarget,0.7); }

  update(t, audioLevel){
    audioLevel = audioLevel||0;
    /* respiración orgánica: suma de ondas en frecuencias no relacionadas,
       para que nunca se sienta como un metrónomo mecánico */
    const breathe = 1 + organicNoise(t, 0)*0.055;

    /* todo sube y baja suave (ease), nunca de un salto — esto evita el "pop" abrupto */
    this.flashEnergy += (this.flashTarget-this.flashEnergy)*0.1;
    this.feedEnergy += (this.feedTarget-this.feedEnergy)*0.06;
    this.baseScale += (this.baseScaleTarget-this.baseScale)*0.04;
    if(this.flashTarget>0) this.flashTarget=Math.max(0,this.flashTarget-0.02);
    if(this.feedTarget>0) this.feedTarget=Math.max(0,this.feedTarget-0.01);
    const spike=this.flashEnergy;
    const feed=this.feedEnergy;

    /* pulso de audio real: crece con el volumen de lo que se está grabando o reproduciendo */
    const audioPulse=audioLevel*0.42;

    const s=this.baseScale*breathe*(1+spike*0.6)*(1+audioPulse);
    this.core.scale.set(14*s*(1+spike*0.9+feed*0.4+audioLevel*0.5),14*s*(1+spike*0.9+feed*0.4+audioLevel*0.5),1);
    this.boilA.scale.set(20*s*(1+organicNoise(t,1.7)*0.1), 20*s*(1+organicNoise(t,1.7)*0.1),1);
    this.boilA.material.rotation=t*0.4;
    this.boilB.scale.set(24*s*(1+organicNoise(t,3.4)*0.09), 24*s*(1+organicNoise(t,3.4)*0.09),1);
    this.boilB.material.rotation=-t*0.3;
    this.plasma.scale.set(36*s*(1+audioLevel*0.18),36*s*(1+audioLevel*0.18),1);
    this.halo.scale.set(82*s*(1+spike*0.4+audioLevel*0.22),82*s*(1+spike*0.4+audioLevel*0.22),1);

    /* saturación calipso extra durante el "procesamiento" de un nuevo mensaje o al sonar audio */
    const hueShift=0.475 - feed*0.02 - audioLevel*0.01;
    this.plasma.material.color.setHSL(hueShift, 0.85, 0.55+feed*0.15+audioLevel*0.1);
    this.plasma.material.opacity=0.75+organicNoise(t,5.1)*0.1+spike*0.2+audioLevel*0.22;
    this.halo.material.opacity=0.28+organicNoise(t,7.2)*0.07+spike*0.25+feed*0.15+audioLevel*0.28;

    this.filaments.forEach(sp=>{
      const a=sp.userData.baseAngle + t*sp.userData.speed;
      const r=sp.userData.radius*s;
      sp.position.set(Math.cos(a)*r, Math.sin(t*0.5+sp.userData.baseAngle)*4, Math.sin(a)*r);
      sp.material.rotation=a*1.3;
      sp.material.opacity=0.4+organicNoise(t,sp.userData.baseAngle)*0.15+spike*0.3+audioLevel*0.25;
      sp.scale.x=(46+feed*20+audioLevel*22)*s*0.5;
    });

    this.coronaInner.rotation.y=t*0.09;
    this.coronaInner.rotation.x=Math.sin(t*0.15)*0.08;
    this.coronaInner.material.size=1.9+spike*1.2+feed*0.8+audioLevel*1.8;
    this.coronaOuter.rotation.y=-t*0.045;
    this.coronaOuter.material.size=2.6+spike*1.4+audioLevel*1.1;

    /* pulso periódico tipo "latido" del arc reactor, cada ~3.2s */
    if(t-this.lastPulseWave>3.2){
      this.lastPulseWave=t;
      emitHeartbeatRing();
    }
  }
}

/* ----------------- TARJETAS DE TEXTO ORBITANDO ----------------- */
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function makeCardTexture(text){
  const font='19px monospace';
  const maxTextWidth=300, padX=20, padY=18, lineHeight=25;
  const measure=document.createElement('canvas').getContext('2d');
  measure.font=font;
  const words=(text||'').split(/\s+/);
  let lines=[], line='';
  words.forEach(word=>{
    const test=line?line+' '+word:word;
    if(measure.measureText(test).width>maxTextWidth){ lines.push(line); line=word; } else line=test;
  });
  if(line) lines.push(line);
  if(lines.length>6){ lines=lines.slice(0,6); lines[5]=lines[5].slice(0,Math.max(0,lines[5].length-1))+'…'; }
  const widest=lines.reduce((m,l)=>Math.max(m,measure.measureText(l).width), 40);
  const w=Math.round(Math.min(340, Math.max(120, widest+padX*2)));
  const h=Math.round(padY*2 + lines.length*lineHeight);

  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  ctx.fillStyle='rgba(4,20,18,0.6)';
  roundRectPath(ctx,3,3,w-6,h-6,14); ctx.fill();
  ctx.strokeStyle='rgba(141,255,240,0.85)'; ctx.lineWidth=2.2;
  roundRectPath(ctx,3,3,w-6,h-6,14); ctx.stroke();
  ctx.fillStyle='#d8fff5';
  ctx.font=font;
  ctx.textBaseline='top';
  lines.forEach((l,i)=>ctx.fillText(l, padX, padY-2+i*lineHeight));
  const tex=new THREE.CanvasTexture(c); tex.needsUpdate=true;
  return {tex, w, h};
}
let textCards=[], textCardMeshes=[], cardedIds=new Set();

const CARD_PX_PER_UNIT=11.3;

}

function updateTextCards(t){
  textCards.forEach(sp=>{
    if(sp.userData.frozen) return;
    const a=sp.userData.baseAngle + t*sp.userData.speed;
    const r=sp.userData.radius;
    sp.position.set(Math.cos(a)*r, sp.userData.height+Math.sin(t*0.35+sp.userData.baseAngle)*4, Math.sin(a)*r);
  });
}

let audioCards=[], audioCardMeshes=[], cardedAudioIds=new Set();
function addAudioCard(msg){
  if(!msg.hasAudio) return;
  if(cardedAudioIds.has(msg.id)) return;
  cardedAudioIds.add(msg.id);

  const core=new THREE.Sprite(new THREE.SpriteMaterial({
    map:texWhiteHot, color:0xffffff, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false
  }));
  core.scale.set(1.6,1.6,1);
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({
    map:texViolet, color:0x9b6bff, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false, opacity:0.7
  }));
  halo.scale.set(3.4,3.4,1);
  halo.add(core);
  halo.userData.msgId=msg.id;

  const idx=audioCards.length;
  const golden=Math.PI*(3-Math.sqrt(5));
  halo.userData.baseAngle=idx*golden+1.7;
  halo.userData.radius=50+(idx%4)*8;
  halo.userData.height=(Math.random()-0.5)*24-8;
  halo.userData.speed=0.05+Math.random()*0.02;
  halo.userData.phase=Math.random()*Math.PI*2;
  halo.visible=cardsVisible;

  pulsar.group.add(halo);
  audioCards.push(halo);
  audioCardMeshes.push(halo);
}
async function syncAudioCards(){
  const all=await dbGetAll('messages');
  all.forEach(msg=>{ if(msg.hasAudio) addAudioCard(msg); });
}
let currentlyPlayingId=null;
let audioReactSource='central'; // 'central' = reacciona el sol | 'orb' = reacciona el planeta tocado

function updateAudioCards(t, audioLevel){
  audioLevel=audioLevel||0;
  audioCards.forEach(sp=>{
    const a=sp.userData.baseAngle + t*sp.userData.speed;
    const r=sp.userData.radius;
    sp.position.set(Math.cos(a)*r, sp.userData.height+Math.sin(t*0.5+sp.userData.phase)*3, Math.sin(a)*r);
    const isPlaying = sp.userData.msgId===currentlyPlayingId;
    const audioPulse = isPlaying ? audioLevel*1.1 : 0;
    const pulse=1+Math.sin(t*1.8+sp.userData.phase)*0.15+audioPulse;
    sp.scale.set(3.4*pulse,3.4*pulse,1);
    sp.material.opacity = isPlaying ? Math.min(1, 0.65+audioLevel*0.5) : 0.7;
  });
}

let zoomedCard=null, zoomSavedState=null;

function animateCameraTo(fromPos, toPos, fromTarget, toTarget, duration){
  return new Promise(resolve=>{
    const t0=performance.now();
    function step(now){
      try{
        const t=Math.min(1,(now-t0)/duration);
        const ease = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
        camera.position.lerpVectors(fromPos, toPos, ease);
        controls.target.lerpVectors(fromTarget, toTarget, ease);
        camera.lookAt(controls.target); // clave: sin esto la cámara se movía sin re-encuadrar
        if(t<1){ requestAnimationFrame(step); return; }
      }catch(e){
        console.warn('Zoom de cámara interrumpido, se resuelve igual:', e);
        camera.position.copy(toPos);
        controls.target.copy(toTarget);
        camera.lookAt(controls.target);
      }
      resolve();
    }
    requestAnimationFrame(step);
  });
}

function zoomToCard(sprite){
  if(zoomedCard) return;
  zoomedCard=sprite;
  sprite.userData.frozen=true;
  zoomSavedState={
    camPos: camera.position.clone(),
    target: controls.target.clone(),
    autoRotate: controls.autoRotate,
    enabled: controls.enabled
  };
  controls.autoRotate=false;
  controls.enabled=false;

  const dir=camera.position.clone().sub(sprite.getWorldPosition(new THREE.Vector3())).normalize();
  const spread=Math.max(sprite.scale.x, sprite.scale.y);
  const desiredDist=THREE.MathUtils.clamp(spread*2.1, 20, 55);
  const worldPos=sprite.getWorldPosition(new THREE.Vector3());
  const toPos=worldPos.clone().add(dir.multiplyScalar(desiredDist));

  animateCameraTo(camera.position.clone(), toPos, controls.target.clone(), worldPos, 650);
  document.getElementById('zoom-close-btn').classList.add('show');

  /* cerrojo de seguridad: si por lo que sea nunca se cierra el zoom, se fuerza solo
     a los 25s para que la app nunca quede completamente bloqueada al tacto */
  clearTimeout(zoomToCard._watchdog);
  zoomToCard._watchdog=setTimeout(()=>{ if(zoomedCard===sprite) unzoomCard(); }, 25000);
}

function unzoomCard(){
  if(!zoomedCard || !zoomSavedState) return;
  const sprite=zoomedCard;
  document.getElementById('zoom-close-btn').classList.remove('show');
  animateCameraTo(camera.position.clone(), zoomSavedState.camPos, controls.target.clone(), zoomSavedState.target, 600)
    .then(()=>{
      controls.syncFromCamera();
      controls.autoRotate=zoomSavedState.autoRotate;
      controls.enabled=zoomSavedState.enabled;
      sprite.userData.frozen=false;
      zoomedCard=null;
      zoomSavedState=null;
    });
}
document.getElementById('zoom-close-btn').addEventListener('click', (e)=>{ e.stopPropagation(); unzoomCard(); });

function gridTexture(){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#020a0a'; ctx.fillRect(0,0,256,256);
  ctx.strokeStyle='rgba(0,190,165,0.32)'; ctx.lineWidth=1;

    ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,256);ctx.stroke();

  }
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(18,18);
  return tex;
}

function makeRing(color){
  const geo=new THREE.RingGeometry(0.5,1,48);
  const mat=new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.7, side:THREE.DoubleSide,
    blending:THREE.AdditiveBlending, depthWrite:false});
  const ring=new THREE.Mesh(geo,mat);
  ring.rotation.x=-Math.PI/2;
  ring.scale.set(0.1,0.1,0.1);
  return ring;
}
function spawnSplash(pos){
  const ring=makeRing(0x8dfff0);
  ring.position.set(pos.x, 0.6, pos.z);
  scene.add(ring);
  const t0=performance.now();
  function step(now){
    const t=Math.min(1,(now-t0)/900);
    const sc=1+t*22;
    ring.scale.set(sc,sc,sc);
    ring.material.opacity=0.7*(1-t);
    if(t<1) requestAnimationFrame(step); else scene.remove(ring);
  }
  requestAnimationFrame(step);

  const n=18, pos3=new Float32Array(n*3), vel=[];
  for(let i=0;i<n;i++){
    pos3[i*3]=pos.x; pos3[i*3+1]=1; pos3[i*3+2]=pos.z;
    const a=Math.random()*Math.PI*2, sp=1.5+Math.random()*2.5;
    vel.push([Math.cos(a)*sp, 3+Math.random()*3, Math.sin(a)*sp]);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos3,3));
  const mat=new THREE.PointsMaterial({map:texCalipso, color:0xbfffee, size:2.4, transparent:true,
    opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false});
  const pts=new THREE.Points(geo,mat);
  scene.add(pts);
  const start=performance.now();
  function stepP(now){
    const dt=(now-start)/1000;
    const arr=pts.geometry.attributes.position.array;
    for(let i=0;i<n;i++){
      arr[i*3]=pos.x+vel[i][0]*dt;
      arr[i*3+1]=1+vel[i][1]*dt-9.8*dt*dt*1.4;
      arr[i*3+2]=pos.z+vel[i][2]*dt;
    }
    pts.geometry.attributes.position.needsUpdate=true;
    mat.opacity=Math.max(0,0.9-dt*1.1);
    if(dt<0.85) requestAnimationFrame(stepP); else scene.remove(pts);
  }
  requestAnimationFrame(stepP);
}

  }

}
function absorbAudioEffect(){
  const n=54, starts=new Float32Array(n*3), targets=[];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, el=Math.random()*Math.PI-Math.PI/2, r=44+Math.random()*16;
    starts[i*3]=PULSAR_POS.x+Math.cos(a)*Math.cos(el)*r;
    starts[i*3+1]=PULSAR_POS.y+Math.sin(el)*r;
    starts[i*3+2]=PULSAR_POS.z+Math.sin(a)*Math.cos(el)*r;
    targets.push(PULSAR_POS.clone());
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(starts.slice(),3));
  const mat=new THREE.PointsMaterial({map:texWhiteHot, color:0x8dfff0, size:3.6, transparent:true,
    opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false});
  const pts=new THREE.Points(geo,mat);
  scene.add(pts);
  const t0=performance.now(), dur=1450;
  function step(now){
    const t=Math.min(1,(now-t0)/dur);
    const arr=pts.geometry.attributes.position.array;
    for(let i=0;i<n;i++){
      arr[i*3]=THREE.MathUtils.lerp(starts[i*3], targets[i].x, t);
      arr[i*3+1]=THREE.MathUtils.lerp(starts[i*3+1], targets[i].y, t);
      arr[i*3+2]=THREE.MathUtils.lerp(starts[i*3+2], targets[i].z, t);
    }
    pts.geometry.attributes.position.needsUpdate=true;
    mat.opacity=0.95*(1-t*0.7);
    if(t<1) requestAnimationFrame(step); else { scene.remove(pts); pulsar.feed(); }
  }
  requestAnimationFrame(step);
  plunk(500,0.3); setTimeout(()=>plunk(680,0.3), 220);
}

function shakeCamera(intensity){
  const orig=controls.target.clone();
  let n=0;
  const iv=setInterval(()=>{
    controls.target.set(orig.x+(Math.random()-0.5)*intensity, orig.y+(Math.random()-0.5)*intensity, orig.z);
    n++;

  },40);
}
let actx=null;
function ensureAudioCtx(){
  if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  return actx;
}
function plunk(freq=440, dur=0.18){
  try{
    ensureAudioCtx();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, actx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur+0.02);
  }catch(e){}
}

/* ----------------- ANÁLISIS DE AUDIO EN VIVO: el pulsar reacciona al sonido real ----------------- */
let audioAnalyser=null, audioDataArray=null;
let recordingSourceNode=null, playbackSourceNode=null;

function ensureAnalyser(){
  const ctx=ensureAudioCtx();
  if(!audioAnalyser){
    audioAnalyser=ctx.createAnalyser();
    audioAnalyser.fftSize=128;
    audioAnalyser.smoothingTimeConstant=0.75;
    audioDataArray=new Uint8Array(audioAnalyser.frequencyBinCount);
  }
  return audioAnalyser;
}
function attachAnalyserToStream(stream){
  try{
    const ctx=ensureAudioCtx();
    const analyser=ensureAnalyser();
    if(recordingSourceNode){ try{ recordingSourceNode.disconnect(); }catch(e){} }
    recordingSourceNode=ctx.createMediaStreamSource(stream);
    recordingSourceNode.connect(analyser); // sin conectar a destination: no hay eco al grabar
  }catch(e){ console.warn('No pude analizar el audio del micrófono:', e); }
}
function detachRecordingAnalyser(){
  if(recordingSourceNode){ try{ recordingSourceNode.disconnect(); }catch(e){} recordingSourceNode=null; }
}
function attachAnalyserToPlayback(audioEl){
  try{
    const ctx=ensureAudioCtx();
    const analyser=ensureAnalyser();
    if(!playbackSourceNode){
      playbackSourceNode=ctx.createMediaElementSource(audioEl);
      playbackSourceNode.connect(analyser);
      analyser.connect(ctx.destination);
    }
    if(ctx.state==='suspended') ctx.resume();
  }catch(e){ console.warn('No pude analizar el audio de reproducción:', e); }
}
function getAudioLevel(){
  if(!audioAnalyser || !audioDataArray) return 0;
  audioAnalyser.getByteFrequencyData(audioDataArray);
  let sum=0;
  for(let i=0;i<audioDataArray.length;i++) sum+=audioDataArray[i];
  return (sum/audioDataArray.length)/255;
}
function animateArc(mesh, start, end, duration, arcHeight){
  return new Promise(resolve=>{
    const t0=performance.now();
    function step(now){
      const t=Math.min(1,(now-t0)/duration);
      mesh.position.set(
        THREE.MathUtils.lerp(start.x,end.x,t),
        THREE.MathUtils.lerp(start.y,end.y,t)+Math.sin(t*Math.PI)*arcHeight,
        THREE.MathUtils.lerp(start.z,end.z,t)
      );
      if(t<1) requestAnimationFrame(step); else resolve();
    }
    requestAnimationFrame(step);
  });
}

/* ---------------------------------------------------------------------
   5. RAYCASTER — tocar el pulsar abre el flujo de creación
   --------------------------------------------------------------------- */
const raycaster=new THREE.Raycaster();
const pointerNDC=new THREE.Vector2();
let downPos=null;
let lastPulsarTapTime=0;

function toNDC(x,y){
  const r=renderer.domElement.getBoundingClientRect();
  pointerNDC.x=((x-r.left)/r.width)*2-1;
  pointerNDC.y=-((y-r.top)/r.height)*2+1;
}
renderer.domElement.addEventListener('pointerdown', e=>{ downPos={x:e.clientX,y:e.clientY}; });
renderer.domElement.addEventListener('pointercancel', ()=>{ downPos=null; });
renderer.domElement.addEventListener('pointerleave', ()=>{ downPos=null; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!downPos) return;
  const dx=e.clientX-downPos.x, dy=e.clientY-downPos.y;
  downPos=null;
  if(Math.sqrt(dx*dx+dy*dy)>8) return; // fue un arrastre de cámara, no un toque
  if(zoomedCard){ unzoomCard(); return; }
  toNDC(e.clientX, e.clientY);
  raycaster.setFromCamera(pointerNDC, camera);

  const cardHits=raycaster.intersectObjects(textCardMeshes);
  if(cardHits.length>0){ zoomToCard(cardHits[0].object); return; }

  const audioHits=raycaster.intersectObjects(audioCardMeshes);
  if(audioHits.length>0){
    const msgId=audioHits[0].object.userData.msgId;
    playHistory=playHistory.slice(0,historyIndex+1);
    playHistory.push(msgId);
    historyIndex=playHistory.length-1;
    audioReactSource='orb';
    playPick(msgId);
    return;
  }

  const hits=raycaster.intersectObject(hitTarget);
  if(hits.length>0){
    const now=performance.now();
    if(now-lastPulsarTapTime<380){
      /* doble click: alterna las tarjetas de texto directamente */
      setCardsVisible(!cardsVisible);
      lastPulsarTapTime=0;
    } else {
      lastPulsarTapTime=now;
      openActionSheet();
    }
  }
});

   6. GRABACIÓN DE VOZ
   --------------------------------------------------------------------- */
let mediaRecorder=null, audioChunks=[], recordedBlob=null, isRecording=false, chosenMime='';

function pickMimeType(){
  if(!('MediaRecorder' in window) || !MediaRecorder.isTypeSupported) return '';
  const candidates=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  for(const c of candidates){ if(MediaRecorder.isTypeSupported(c)) return c; }
  return '';
}

/* ----------------- TRANSCRIPCIÓN EN VIVO MIENTRAS SE GRABA ----------------- */
let liveRecognition=null, liveTranscript='';
function startLiveTranscription(){
  liveTranscript='';
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return; // sin soporte: el audio se guarda igual, solo sin título/etiqueta automática
  try{
    liveRecognition=new SR();
    liveRecognition.lang=navigator.language||'es-ES';
    liveRecognition.continuous=true;
    liveRecognition.interimResults=true;
    liveRecognition.onresult=(e)=>{
      let finalText='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) finalText+=e.results[i][0].transcript;
      }
      if(finalText) liveTranscript=(liveTranscript+' '+finalText).trim();
    };
    liveRecognition.onerror=()=>{};
    liveRecognition.onend=()=>{ if(liveRecognition && liveRecognition._keepAlive){ try{ liveRecognition.start(); }catch(e){} } };
    liveRecognition._keepAlive=true;
    liveRecognition.start();
  }catch(e){ liveRecognition=null; }
}
function stopLiveTranscription(){
  if(liveRecognition){
    liveRecognition._keepAlive=false;
    try{ liveRecognition.stop(); }catch(e){}
  }
  return liveTranscript.trim();
}
function guessTagsFromText(text){
  const low=text.toLowerCase();
  return getTagDefs().filter(t=>low.includes(t.toLowerCase()));
}

function setRecStatus(msg){
  const el=document.getElementById('rec-status');
  if(el){
    el.textContent=msg;
    el.style.color = msg.indexOf('⚠️')===0 ? '#ffb37a' : '';
  }
  showToast(msg, 5200);
}

async function startRecording(){
  let inIframe=false;
  try{ inIframe = window.self!==window.top; }catch(e){ inIframe=true; }

  if(!window.isSecureContext){
    setRecStatus('⚠️ Sin HTTPS: el micrófono no funciona así. Subí el archivo a GitHub Pages, o abrilo con un servidor local (http://localhost).');
    return false;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setRecStatus('⚠️ Este navegador no tiene soporte para grabar audio.');
    return false;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chosenMime=pickMimeType();
    mediaRecorder = chosenMime ? new MediaRecorder(stream,{mimeType:chosenMime}) : new MediaRecorder(stream);
    attachAnalyserToStream(stream);
    audioChunks=[];
    startLiveTranscription();
    mediaRecorder.ondataavailable=e=>{ if(e.data && e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.onerror=e=>{ setRecStatus('⚠️ Error al grabar: '+(e.error?e.error.name:'desconocido')); };
    mediaRecorder.onstop=()=>{
      recordedBlob=new Blob(audioChunks,{type:chosenMime||'audio/webm'});
      stream.getTracks().forEach(t=>t.stop());
      detachRecordingAnalyser();
      const transcript=stopLiveTranscription();
      if(audioChunks.length===0 || recordedBlob.size===0){
        setRecStatus('⚠️ No se grabó audio (0 bytes). El navegador cortó el acceso al micrófono a mitad de camino — probá en una pestaña propia, fuera de cualquier vista previa.');
        return;
      }
      setRecStatus('integrando el audio al núcleo...');
      setTimeout(()=>{
        const title=transcript ? transcript.trim().slice(0,42) : '';
        const autoTags=transcript ? guessTagsFromText(transcript) : [];
        commitMessage({type:'voice', text:'', hasAudio:true, blob:recordedBlob, title, transcript, autoTags});
      }, 650);
    };
    mediaRecorder.start();
    isRecording=true;
    setRecStatus('grabando... tocá para detener');
    return true;
  }catch(err){
    let msg='⚠️ No pude acceder al micrófono.';
    if(err){
      if(err.name==='NotAllowedError') msg='⚠️ Permiso bloqueado. '+(inIframe?'Esta vista previa corre dentro de un iframe sin permiso de micrófono — abrí el archivo en su propia pestaña del navegador.':'Revisá el ícono de candado/micrófono en la barra de direcciones y volvé a intentar.');
      else if(err.name==='NotFoundError') msg='⚠️ No encontré un micrófono en este dispositivo.';
      else if(err.name==='NotReadableError') msg='⚠️ El micrófono está siendo usado por otra app.';
      else if(err.name==='SecurityError') msg='⚠️ Bloqueado por seguridad. '+(inIframe?'Salí de la vista previa y abrí el archivo directo en el navegador.':'Probá servirlo por HTTPS.');
      else msg='⚠️ '+err.name+': '+(err.message||'error desconocido');
    }
    setRecStatus(msg);
    return false;
  }
}
function stopRecording(){
  if(mediaRecorder && isRecording){ mediaRecorder.stop(); isRecording=false; }
}

async function toggleQuickRecord(){
  const btn=document.getElementById('pa-voz');
  if(!isRecording){
    recordedBlob=null; audioChunks=[];
    const ok=await startRecording();
    if(ok){ btn.textContent='■'; btn.classList.add('recording'); }
  } else {
    stopRecording();
    btn.textContent='●';
    btn.classList.remove('recording');
    btn.style.opacity='0.4';
    btn.style.pointerEvents='none';
    /* commitMessage() se dispara solo, desde mediaRecorder.onstop */
    setTimeout(()=>{ btn.style.opacity='1'; btn.style.pointerEvents='auto'; }, 1400);

}

function openTextCompose(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  showOverlay(`
    <div class="o-label">Mensaje de texto</div>
    <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;">
      <textarea id="msg-text" placeholder="Escribile a quien vas a ser..." style="flex:1;"></textarea>
      ${SR?'<button class="icon-pill icon-record" id="dictate-btn" style="width:44px;height:44px;font-size:15px;flex-shrink:0;" title="dictar">●</button>':''}
    </div>
    <button class="btn-ghost" id="done-text-btn">listo — se guarda solo</button>
  `);
  const ta=document.getElementById('msg-text');
  let committed=false;
  const doCommit=async ()=>{
    const val=ta.value.trim();
    if(committed || !val) return;
    committed=true;
    await commitMessage({type:'text', text:val, hasAudio:false, blob:null});
  };

  let dictating=false, dictateRecognition=null;
  const dictateBtn=document.getElementById('dictate-btn');
  if(dictateBtn){
    dictateBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); }); // no le robe el foco al textarea
    dictateBtn.addEventListener('click', ()=>{
      if(!dictating){
        try{
          dictateRecognition=new SR();
          dictateRecognition.lang=navigator.language||'es-ES';
          dictateRecognition.continuous=true;
          dictateRecognition.interimResults=true;
          const base=ta.value;
          dictateRecognition.onresult=(e)=>{
            let finalText='';
            for(let i=e.resultIndex;i<e.results.length;i++){
              if(e.results[i].isFinal) finalText+=e.results[i][0].transcript;
            }
            if(finalText) ta.value=(base+' '+finalText).trim();
          };
          dictateRecognition.onend=()=>{ if(dictating){ try{ dictateRecognition.start(); }catch(e){} } };
          dictateRecognition.start();
          dictating=true;
          dictateBtn.classList.add('recording');
        }catch(e){ showToast('No pude iniciar el dictado por voz.'); }
      } else {
        dictating=false;
        if(dictateRecognition){ dictateRecognition.onend=null; try{ dictateRecognition.stop(); }catch(e){} }
        dictateBtn.classList.remove('recording');
        ta.focus();
      }
    });
  }

  ta.addEventListener('blur', doCommit);
  document.getElementById('done-text-btn').addEventListener('click', async ()=>{
    if(!ta.value.trim()){ closeOverlay(); return; }
    await doCommit();
  });
  setTimeout(()=>ta.focus(), 60);
}

/* el mensaje se guarda EN EL MOMENTO en que se termina de grabar o escribir */
async function commitMessage({type, text, hasAudio, blob, title, transcript, autoTags}){
  const id=uid();
  const msg={
    id, type, text, hasAudio, createdAt:Date.now(), bounces:[],
    tags: autoTags||[],
    title: title||'',
    transcript: transcript||''
  };
  await dbPut('messages', msg);
  if(hasAudio && blob) await dbPut('audio', {id, blob});

  if(hasAudio) absorbAudioEffect(); else pulsar.feed();
  if(text) addTextCard(msg);
  if(hasAudio) addAudioCard(msg);

  const total=addResonancia(1);
  pulsar.setResonancia(total);
  refreshLists();
  closeOverlay();
  showToast(hasAudio ? 'Tu voz quedó integrada al núcleo ✦' : 'Tu mensaje quedó suspendido en el plasma ✦');
}

/* ------------- paso de programación: Deriva vs Coordinación ------------- */
const PRESETS={
  rapido:{label:'Eco rápido', desc:'para probar: +30s y +2min', bounces:[
    {label:'+30 segundos', ms:30*1000},{label:'+2 minutos', ms:2*60*1000}]},
  cercano:{label:'Cercano', desc:'1 semana y 1 mes', bounces:[
    {label:'en 1 semana', ms:7*24*3600*1000},{label:'en 1 mes', ms:30*24*3600*1000}]},
  profundo:{label:'Profundo', desc:'1 mes, 6 meses y 1 año', bounces:[
    {label:'en 1 mes', ms:30*24*3600*1000},{label:'en 6 meses', ms:182*24*3600*1000},{label:'en 1 año', ms:365*24*3600*1000}]},
};
let chosenBounces=[];
let scheduleMode='deriva';

function openScheduleStep(){
  chosenBounces=[];
  scheduleMode='deriva';
  showOverlay(`
    <div class="o-label">¿Cuándo querés que vuelva a vos?</div>
    <button class="btn-ghost" id="save-only-btn" style="margin-bottom:14px;">✓ solo guardar, sin programar</button>
    <div class="mode-toggle">
      <div class="mode-btn active" data-mode="deriva">🌊 Deriva</div>
      <div class="mode-btn" data-mode="coordinacion">🎯 Coordinación</div>
    </div>
    <div id="schedule-body"></div>
    <div id="chosen-bounces"></div>
    <button class="btn-primary" id="confirm-schedule-btn" disabled>Confirmar rebotes</button>
  `);
  document.getElementById('save-only-btn').addEventListener('click', ()=>{
    closeOverlay();
    showToast('Guardado. Podés programarlo después desde "En tránsito".');
  });
  document.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      scheduleMode=btn.dataset.mode;
      chosenBounces=[];
      renderScheduleBody();
      renderChosenBounces();
    });
  });
  document.getElementById('confirm-schedule-btn').addEventListener('click', confirmSchedule);
  renderScheduleBody();
}

function renderScheduleBody(){
  const body=document.getElementById('schedule-body');
  if(scheduleMode==='deriva'){
    body.innerHTML=`
      <div class="preset-grid" id="preset-grid"></div>
      <div class="custom-date-row">
        <input type="datetime-local" id="custom-date">
        <button class="mini-btn" id="add-custom-btn">+ fecha propia</button>
      </div>
    `;
    const grid=document.getElementById('preset-grid');
    Object.entries(PRESETS).forEach(([key,p])=>{
      const card=document.createElement('div');
      card.className='preset-card';
      card.innerHTML=`<div class="p-title">${p.label}</div><div class="p-desc">${p.desc}</div>`;
      card.addEventListener('click',()=>{
        chosenBounces=p.bounces.map(b=>({label:b.label, timestamp:Date.now()+b.ms}));
        document.querySelectorAll('.preset-card').forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        renderChosenBounces();
      });
      grid.appendChild(card);
    });
    document.getElementById('add-custom-btn').addEventListener('click',()=>{
      const input=document.getElementById('custom-date');
      if(!input.value) return;
      const ts=new Date(input.value).getTime();
      if(ts<=Date.now()){ showToast('Elegí una fecha en el futuro.'); return; }
      chosenBounces.push({label:'fecha propia · '+new Date(ts).toLocaleDateString('es-CL'), timestamp:ts});
      document.querySelectorAll('.preset-card').forEach(c=>c.classList.remove('selected'));
      renderChosenBounces();
      input.value='';
    });
  } else {
    body.innerHTML=`
      <div class="coord-copy">Elegí el instante exacto en que querés encontrarte con vos mismo —
      el punto del futuro donde esperás que la conexión pase, y que estés ahí, escuchando.</div>
      <div class="custom-date-row">
        <input type="datetime-local" id="coord-date">
      </div>
      <label class="repeat-row">
        <input type="checkbox" id="coord-repeat-check"> repetir este encuentro
      </label>
      <div class="repeat-details" id="coord-repeat-details">
        <select id="coord-interval">
          <option value="${7*24*3600*1000}">cada semana</option>
          <option value="${30*24*3600*1000}">cada mes</option>
          <option value="${182*24*3600*1000}">cada 6 meses</option>
          <option value="${365*24*3600*1000}">cada año</option>
        </select>
        <input type="number" id="coord-repeats" min="2" max="12" value="3" style="width:64px;"> veces
      </div>
    `;
    const dateInput=document.getElementById('coord-date');
    const buildCoordBounces=()=>{
      if(!dateInput.value) return;
      const ts=new Date(dateInput.value).getTime();
      if(ts<=Date.now()){ showToast('Elegí una fecha en el futuro.'); return; }
      const repeatOn=document.getElementById('coord-repeat-check').checked;
      chosenBounces=[{label:'encuentro · '+new Date(ts).toLocaleDateString('es-CL'), timestamp:ts}];
      if(repeatOn){
        const interval=parseInt(document.getElementById('coord-interval').value,10);
        const reps=Math.min(12,Math.max(2,parseInt(document.getElementById('coord-repeats').value,10)||3));
        for(let i=1;i<reps;i++){
          chosenBounces.push({label:'encuentro '+(i+1)+' · '+new Date(ts+interval*i).toLocaleDateString('es-CL'), timestamp:ts+interval*i});
        }
      }
      renderChosenBounces();
    };
    dateInput.addEventListener('change', buildCoordBounces);
    document.getElementById('coord-repeat-check').addEventListener('change', e=>{
      document.getElementById('coord-repeat-details').classList.toggle('show', e.target.checked);
      buildCoordBounces();
    });
    document.getElementById('coord-interval').addEventListener('change', buildCoordBounces);
    document.getElementById('coord-repeats').addEventListener('input', buildCoordBounces);
  }
}

function renderChosenBounces(){
  chosenBounces.sort((a,b)=>a.timestamp-b.timestamp);
  const wrap=document.getElementById('chosen-bounces');
  wrap.innerHTML='';
  chosenBounces.forEach((b,i)=>{
    const chip=document.createElement('div');
    chip.className='bounce-chip';
    chip.innerHTML=`<span>${b.label}</span><span class="x" data-i="${i}">✕</span>`;
    chip.querySelector('.x').addEventListener('click',()=>{ chosenBounces.splice(i,1); renderChosenBounces(); });
    wrap.appendChild(chip);
  });
  document.getElementById('confirm-schedule-btn').disabled = chosenBounces.length===0;
}

async function confirmSchedule(){
  if(!pendingMessage || chosenBounces.length===0) return;
  pendingMessage.bounces=chosenBounces.map(b=>({label:b.label, timestamp:b.timestamp, arrived:false, opened:false}));
  await dbPut('messages', pendingMessage);
  await playThrowPreview(pendingMessage.bounces.length);
  pendingMessage=null;
  closeOverlay();
  showToast('Rebotes programados sobre el agua.');
  refreshLists();
}

async function deleteMessageCompletely(id){
  await dbDelete('messages', id);
  try{ await dbDelete('audio', id); }catch(e){}

  const aidx=audioCards.findIndex(sp=>sp.userData.msgId===id);
  if(aidx>=0){
    const sp=audioCards[aidx];
    pulsar.group.remove(sp);
    audioCards.splice(aidx,1);
    const mi=audioCardMeshes.indexOf(sp);
    if(mi>=0) audioCardMeshes.splice(mi,1);
    cardedAudioIds.delete(id);
  }
  const tidx=textCards.findIndex(sp=>sp.userData.msgId===id);
  if(tidx>=0){
    const sp=textCards[tidx];
    if(zoomedCard===sp) unzoomCard();
    pulsar.group.remove(sp);
    textCards.splice(tidx,1);
    const mi=textCardMeshes.indexOf(sp);
    if(mi>=0) textCardMeshes.splice(mi,1);
    cardedIds.delete(id);
  }
  refreshLists();
}

/* ----------------- ETIQUETAS DEFINIDAS POR EL USUARIO (sin emoji) ----------------- */
function getTagDefs(){
  try{ return JSON.parse(localStorage.getItem('kairos_tagdefs')||'[]'); }catch(e){ return []; }
}
function setTagDefs(arr){ localStorage.setItem('kairos_tagdefs', JSON.stringify(arr)); }
async function addTagDef(name){
  name=(name||'').trim();
  if(!name) return;
  const defs=getTagDefs();
  if(!defs.includes(name)){ defs.push(name); setTagDefs(defs); }
}
async function removeTagDef(name){
  setTagDefs(getTagDefs().filter(t=>t!==name));
  /* también se saca de todos los audios que la tenían */
  const all=await dbGetAll('messages');
  for(const msg of all){
    if(msg.tags && msg.tags.includes(name)){
      msg.tags=msg.tags.filter(t=>t!==name);
      await dbPut('messages', msg);
    }
  }
}

async function renderAudios(){
  const all=await dbGetAll('messages');
  const audios=all.filter(m=>m.hasAudio).sort((a,b)=>b.createdAt-a.createdAt);
  const wrap=document.getElementById('view-audios');
  const tagDefs=getTagDefs();

  const managerHtml=`
    <h3 class="section-label">Etiquetas</h3>
    <div class="custom-date-row" style="margin-bottom:8px;">
      <input type="text" id="new-tagdef-input" placeholder="nombre de etiqueta" style="flex:1;min-width:110px;">
      <button class="mini-btn" id="new-tagdef-btn">crear</button>
    </div>
    <div id="tagdef-list" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;">
      ${tagDefs.length===0
        ? '<span style="font-size:10.5px;color:var(--text-dim);">todavía no definiste ninguna</span>'
        : tagDefs.map(t=>`<span class="bounce-chip">${t.replace(/</g,'&lt;')}<span class="x" data-deltag="${t.replace(/"/g,'&quot;')}">✕</span></span>`).join('')}
    </div>
  `;

  if(audios.length===0){
    wrap.innerHTML=managerHtml+'<div class="empty-state">Todavía no grabaste ningún audio.</div>';
  } else {
    let cardsHtml='';
    for(const msg of audios){
      const rec=await dbGet('audio', msg.id);
      const src=rec ? URL.createObjectURL(rec.blob) : '';
      const tags=msg.tags||[];
      const scheduleHtml = msg.bounces.length===0
        ? `<div class="bounce-line"><span>sin programar</span><span class="cal-link" data-schedule="${msg.id}">programar</span></div>`
        : msg.bounces.map(b=>`<div class="bounce-line${b.arrived?' arrived':''}"><span>${b.arrived?'llegó':formatEta(b.timestamp)}</span></div>`).join('');
      const tagToggleHtml = tagDefs.length===0
        ? ''
        : tagDefs.map(t=>{
            const on=tags.includes(t);
            return `<span class="mini-btn${on?' tag-on':''}" data-toggletag="${msg.id}" data-tag="${t.replace(/"/g,'&quot;')}" style="margin:3px 4px 0 0;display:inline-block;">${t.replace(/</g,'&lt;')}</span>`;
          }).join('');
      cardsHtml+=`
        <div class="msg-card">
          <div class="m-top"><span>${new Date(msg.createdAt).toLocaleDateString('es-CL')}</span>
          <span><span class="cal-link" data-delete="${msg.id}" style="color:#ff8d8d;">eliminar</span></span></div>
          <div class="custom-date-row" style="margin-bottom:8px;">
            <input type="text" data-titleinput="${msg.id}" value="${(msg.title||'').replace(/"/g,'&quot;')}" placeholder="ponele nombre..." style="flex:1;min-width:110px;">
            <button class="mini-btn" data-savetitle="${msg.id}">guardar</button>
          </div>
          <audio controls style="width:100%;margin-bottom:8px;" src="${src}"></audio>
          <div>${tagToggleHtml}</div>
          ${scheduleHtml}
        </div>
      `;
    }
    wrap.innerHTML=managerHtml+cardsHtml;
  }

  document.getElementById('new-tagdef-btn').addEventListener('click', async ()=>{
    const input=document.getElementById('new-tagdef-input');
    await addTagDef(input.value);
    input.value='';
    renderAudios();
  });
  wrap.querySelectorAll('[data-deltag]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      await removeTagDef(el.dataset.deltag);
      renderAudios();
    });
  });
  wrap.querySelectorAll('.cal-link[data-schedule]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      pendingMessage=await dbGet('messages', el.dataset.schedule);
      openScheduleStep();
    });
  });
  wrap.querySelectorAll('.cal-link[data-delete]').forEach(el=>{
    el.addEventListener('click', async ()=>{

        await deleteMessageCompletely(el.dataset.delete);
      }
    });
  });
  wrap.querySelectorAll('[data-toggletag]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id=el.dataset.toggletag, tag=el.dataset.tag;
      const msg=await dbGet('messages', id);
      if(!msg) return;
      msg.tags=msg.tags||[];
      if(msg.tags.includes(tag)) msg.tags=msg.tags.filter(t=>t!==tag);
      else msg.tags.push(tag);
      await dbPut('messages', msg);
      renderAudios();

  wrap.querySelectorAll('[data-savetitle]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id=el.dataset.savetitle;

      showToast('Nombre guardado.');
    });

async function refreshLists(){
  const all=await dbGetAll('messages');
  const transito=document.getElementById('view-transito');
  const llegados=document.getElementById('view-llegados');
  transito.innerHTML=''; llegados.innerHTML='';
  let transitoCount=0, llegadosCount=0;
  syncTextCards();
  syncAudioCards();
  renderPlaybackTagFilter();
  renderAudios();
  const tagDefs=getTagDefs();

  all.sort((a,b)=>b.createdAt-a.createdAt).forEach(msg=>{
    const pendientes=msg.bounces.filter(b=>!b.arrived);
    const disponibles=msg.bounces.filter(b=>b.arrived && !b.opened);

    if(msg.bounces.length===0 || pendientes.length>0){
      transitoCount++;
      const card=document.createElement('div');
      card.className='msg-card';
      const preview=msg.text ? (msg.text.length>90?msg.text.slice(0,90)+'…':msg.text) : '(mensaje de voz)';
      const tagToggleHtml = (msg.text && tagDefs.length>0)
        ? '<div style="margin-bottom:6px;">'+tagDefs.map(t=>{
            const on=(msg.tags||[]).includes(t);
            return `<span class="mini-btn${on?' tag-on':''}" data-toggletxttag="${msg.id}" data-tag="${t.replace(/"/g,'&quot;')}" style="margin:3px 4px 0 0;display:inline-block;">${t.replace(/</g,'&lt;')}</span>`;
          }).join('')+'</div>'
        : '';
      card.innerHTML=`
        <div class="m-top"><span>${new Date(msg.createdAt).toLocaleDateString('es-CL')}</span>
        <span>${msg.hasAudio?'🎙️':''} ${msg.text?'✎':''}</span></div>
        <div class="m-preview">${preview}</div>
        ${tagToggleHtml}
      `;
      if(msg.bounces.length===0){
        const line=document.createElement('div');
        line.className='bounce-line';
        line.innerHTML=`<span>sin programar todavía</span><span class="cal-link" data-schedule="${msg.id}">programar ahora</span>`;
        card.appendChild(line);
      } else {
        msg.bounces.forEach(b=>{
          const line=document.createElement('div');
          line.className='bounce-line'+(b.arrived?' arrived':'');
          line.innerHTML=`<span>${b.arrived? '✓ llegó' : formatEta(b.timestamp)}</span>` +
            (b.arrived?'':`<span class="cal-link" data-ts="${b.timestamp}" data-label="${b.label}">🔔 calendario</span>`);
          card.appendChild(line);
        });
      }
      transito.appendChild(card);
    }

    if(disponibles.length>0){
      llegadosCount++;
      const card=document.createElement('div');
      card.className='msg-card';
      const preview=msg.text ? (msg.text.length>90?msg.text.slice(0,90)+'…':msg.text) : '(mensaje de voz)';
      card.innerHTML=`
        <div class="m-top"><span>escrito el ${new Date(msg.createdAt).toLocaleDateString('es-CL')}</span></div>
        <div class="m-preview">${preview}</div>
        <button class="arrived-btn" data-id="${msg.id}">abrir mensaje ✨</button>
      `;
      llegados.appendChild(card);
    }
  });

  document.getElementById('badge-transito').style.display = transitoCount>0?'inline-block':'none';
  document.getElementById('badge-transito').textContent=transitoCount;
  document.getElementById('badge-llegados').style.display = llegadosCount>0?'inline-block':'none';
  document.getElementById('badge-llegados').textContent=llegadosCount;
  document.getElementById('badge-toggle').style.display = llegadosCount>0?'inline-block':'none';
  document.getElementById('badge-toggle').textContent=llegadosCount;

  if(transitoCount===0) transito.innerHTML='<div class="empty-state">Todavía no hay piedras en camino.<br>Tocá el pulsar para escribirle a tu futuro.</div>';
  if(llegadosCount===0) llegados.innerHTML='<div class="empty-state">Cuando un rebote llegue a destino,<br>aparecerá acá para que lo abras.</div>';

  transito.querySelectorAll('.cal-link[data-ts]').forEach(el=>{
    el.addEventListener('click',()=>{
      makeICS('Kairós: un mensaje de tu pasado', 'Volvé al pulsar Kairós — un mensaje que te escribiste está por llegar.', parseInt(el.dataset.ts,10));
    });
  });
  transito.querySelectorAll('.cal-link[data-schedule]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      pendingMessage=await dbGet('messages', el.dataset.schedule);
      openScheduleStep();
    });
  });
  transito.querySelectorAll('[data-toggletxttag]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id=el.dataset.toggletxttag, tag=el.dataset.tag;
      const msg=await dbGet('messages', id);
      if(!msg) return;
      msg.tags=msg.tags||[];
      if(msg.tags.includes(tag)) msg.tags=msg.tags.filter(t=>t!==tag);
      else msg.tags.push(tag);
      await dbPut('messages', msg);
      refreshLists();
    });
  });
  llegados.querySelectorAll('.arrived-btn').forEach(el=>{
    el.addEventListener('click',()=>openArrivedMessage(el.dataset.id));
  });
}

async function openArrivedMessage(id){
  const msg=await dbGet('messages', id);
  if(!msg) return;
  const bounce=msg.bounces.find(b=>b.arrived && !b.opened);
  if(!bounce) return;

  let audioHtml='';
  if(msg.hasAudio){
    const rec=await dbGet('audio', id);
    if(rec) audioHtml=`<audio controls autoplay src="${URL.createObjectURL(rec.blob)}"></audio>`;
  }
  showOverlay(`
    <div class="o-label">Mensaje del pasado · ${bounce.label}</div>
    <div class="o-body">${(msg.text||'').replace(/</g,'&lt;')}</div>
    ${audioHtml}
    <button class="btn-ghost" id="close-arrived">cerrar</button>
  `);
  document.getElementById('close-arrived').addEventListener('click', closeOverlay);

  bounce.opened=true;
  await dbPut('messages', msg);
  const total=addResonancia(1);
  pulsar.setResonancia(total);
  pulsar.flash();
  refreshLists();
}

/* ---------------------------------------------------------------------
   9. VIGÍA DE REBOTES
   --------------------------------------------------------------------- */
async function checkArrivals(){
  const all=await dbGetAll('messages');
  let anyArrived=false;
  for(const msg of all){
    let changed=false;
    for(const b of msg.bounces){
      if(!b.arrived && b.timestamp<=Date.now()){ b.arrived=true; changed=true; anyArrived=true; }
    }
    if(changed){
      await dbPut('messages', msg);
      pulsar.flash();
      if(Notification && Notification.permission==='granted'){
        new Notification('Kairós', {body:'Un mensaje de tu pasado llegó a la orilla.'});
      }
    }
  }
  if(anyArrived){
    plunk(620,0.5);
    showToast('Un rebote llegó a destino. Revisá "Llegados".');
    refreshLists();
  }
}
setInterval(checkArrivals, 15000);

/* ---------------------------------------------------------------------
   10. NOTIFICACIONES
   --------------------------------------------------------------------- */
const notifBtn=document.getElementById('notif-btn');
function updateNotifBtn(){
  if(!('Notification' in window)){ notifBtn.style.display='none'; return; }
  if(Notification.permission==='granted'){ notifBtn.textContent='🔔 avisos activos'; notifBtn.classList.add('on'); }
  else { notifBtn.textContent='🔔 activar avisos'; notifBtn.classList.remove('on'); }
}
notifBtn.addEventListener('click', async ()=>{
  if('Notification' in window && Notification.permission!=='granted'){
    await Notification.requestPermission();
    updateNotifBtn();
    showToast('Avisos activados en este navegador.');
  }
});
updateNotifBtn();

/* ---------------------------------------------------------------------
   11. MODO ALEATORIO — REPRODUCIR
   --------------------------------------------------------------------- */
let shuffling=false, advanceTimer=null;
let playHistory=[], historyIndex=-1;
const playBtn=document.getElementById('play-big-btn');
const skipBtn=document.getElementById('skip-btn');
const prevBtn=document.getElementById('prev-btn');
const nowPlaying=document.getElementById('now-playing');
const nowPlayingAudio=document.getElementById('now-playing-audio');

function clearAdvanceTimer(){ if(advanceTimer){ clearTimeout(advanceTimer); advanceTimer=null; } }

let selectedPlaybackTags=new Set();

function messagePassesTagFilter(msg){
  if(selectedPlaybackTags.size===0) return true; // sin selección = suena todo
  const tags=msg.tags||[];
  return tags.some(t=>selectedPlaybackTags.has(t));
}

async function getPlaybackPool(){
  const all=await dbGetAll('messages');
  return all.filter(m=>(m.hasAudio||m.text) && messagePassesTagFilter(m)).map(m=>m.id);
}

function renderPlaybackTagFilter(){
  const defs=getTagDefs();
  const wrap=document.getElementById('playback-tag-filter');
  if(!wrap) return;
  /* limpia de la selección cualquier etiqueta que ya no exista */
  selectedPlaybackTags.forEach(t=>{ if(!defs.includes(t)) selectedPlaybackTags.delete(t); });
  if(defs.length===0){ wrap.innerHTML=''; return; }
  wrap.innerHTML=defs.map(t=>{
    const on=selectedPlaybackTags.has(t);
    return `<span class="mini-btn${on?' tag-on':''}" data-playtag="${t.replace(/"/g,'&quot;')}">${t.replace(/</g,'&lt;')}</span>`;
  }).join('');
  wrap.querySelectorAll('[data-playtag]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const t=el.dataset.playtag;
      if(selectedPlaybackTags.has(t)) selectedPlaybackTags.delete(t);
      else selectedPlaybackTags.add(t);
      renderPlaybackTagFilter();
    });
  });
}

async function playPick(msgId){
  clearAdvanceTimer();
  nowPlayingAudio.onended=null;
  const msg=await dbGet('messages', msgId);
  if(!msg){ playNext(); return; }

  pulsar.flash();
  shuffling=true;
  playBtn.classList.add('playing');
  playBtn.textContent='❚❚';
  nowPlayingAudio.pause();

  let willAutoAdvanceAfter=4200;
  currentlyPlayingId=null;

  if(msg.hasAudio){
    const rec=await dbGet('audio', msg.id);
    if(rec){
      currentlyPlayingId=msg.id;
      nowPlaying.textContent='🎙️ '+new Date(msg.createdAt).toLocaleDateString('es-CL');
      attachAnalyserToPlayback(nowPlayingAudio);
      nowPlayingAudio.src=URL.createObjectURL(rec.blob);
      nowPlayingAudio.play().catch(()=>{});
      /* pausa de 2 segundos de silencio entre un audio y el siguiente */
      nowPlayingAudio.onended=()=>{ if(shuffling) advanceTimer=setTimeout(()=>{ if(shuffling) playNext(); }, 2000); };
      willAutoAdvanceAfter=null;
    }
  } else {
    const preview=(msg.text||'').slice(0,54);
    nowPlaying.textContent='✎ '+preview+(msg.text&&msg.text.length>54?'…':'');
  }

  if(willAutoAdvanceAfter){
    advanceTimer=setTimeout(()=>{ if(shuffling) playNext(); }, willAutoAdvanceAfter);
  }
}

let shuffleBag=[];
function shuffleArray(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
async function pickNextFromBag(){
  const pool=await getPlaybackPool();
  if(pool.length===0) return null;
  shuffleBag=shuffleBag.filter(id=>pool.includes(id)); // por si algo se borró o el filtro cambió
  if(shuffleBag.length===0){
    shuffleBag=shuffleArray(pool);
    /* que la vuelta nueva no arranque justo con lo último que sonó */
    if(shuffleBag.length>1 && shuffleBag[shuffleBag.length-1]===currentlyPlayingId){
      [shuffleBag[shuffleBag.length-1], shuffleBag[shuffleBag.length-2]]=[shuffleBag[shuffleBag.length-2], shuffleBag[shuffleBag.length-1]];
    }
  }
  return shuffleBag.pop();
}

async function playNext(){
  clearAdvanceTimer();
  if(historyIndex < playHistory.length-1){
    historyIndex++;
    await playPick(playHistory[historyIndex]);
    return;
  }
  const msgId=await pickNextFromBag();
  if(!msgId){
    showToast('Todavía no grabaste ni escribiste nada para reproducir.');
    stopShuffle();
    return;
  }
  playHistory.push(msgId);
  historyIndex=playHistory.length-1;
  await playPick(msgId);
}

async function playPrevious(){
  if(historyIndex<=0){ showToast('No hay nada anterior todavía.'); return; }
  historyIndex--;
  await playPick(playHistory[historyIndex]);
}

function stopShuffle(){
  shuffling=false;
  clearAdvanceTimer();
  playBtn.classList.remove('playing');
  playBtn.textContent='▶';
  nowPlayingAudio.onended=null;
  nowPlayingAudio.pause();
  currentlyPlayingId=null;
}

playBtn.addEventListener('click', async ()=>{
  if(shuffling){ stopShuffle(); return; }
  audioReactSource='central';
  await playNext();
});
skipBtn.addEventListener('click', ()=>{ audioReactSource='central'; playNext(); });
prevBtn.addEventListener('click', ()=>{ audioReactSource='central'; playPrevious(); });

   12. ARRANQUE DIRECTO
   --------------------------------------------------------------------- */
(function checkIframe(){
  let inIframe=false;
  try{ inIframe = window.self!==window.top; }catch(e){ inIframe=true; }
  if(inIframe){
    document.getElementById('iframe-warning').style.display='block';
    document.getElementById('open-tab-btn').addEventListener('click', ()=>{
      window.open(window.location.href, '_blank');
    });
  }
})();

setTimeout(()=>{ document.getElementById('hint').style.opacity='0'; }, 6000);

/* ----- sello Chamalnquimyst: se difumina a los 5s, vuelve con el tacto ----- */
(function brandFadeCycle(){
  const brandEl=document.querySelector('.brand');
  let fadeTimer=null;
  function scheduleFade(){
    brandEl.style.opacity='1';
    clearTimeout(fadeTimer);
    fadeTimer=setTimeout(()=>{ brandEl.style.opacity='0'; }, 5000);
  }
  document.addEventListener('pointerdown', scheduleFade);
  scheduleFade();
})();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if(useBloom && composer) composer.setSize(innerWidth, innerHeight);
});

/* ---------------------------------------------------------------------
   13. LOOP PRINCIPAL
   --------------------------------------------------------------------- */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  try{
    const t=clock.getElapsedTime();
    const level=getAudioLevel();
    pulsar.update(t, audioReactSource==='central' ? level : 0);
    updateTextCards(t);
    updateAudioCards(t, audioReactSource==='orb' ? level : 0);
    reflection.material.opacity=0.16+Math.sin(t*0.9)*0.05;
    controls.update();
    if(useBloom && composer) composer.render(); else renderer.render(scene, camera);
  }catch(e){
    console.warn('Error en un frame de animación, sigo con el siguiente:', e);
  }
}
animate();

refreshLists();
checkArrivals();
